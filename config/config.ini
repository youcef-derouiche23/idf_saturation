[hdfs]
raw_validations_path  = hdfs://namenode:9000/raw/validations
raw_stations_path     = hdfs://namenode:9000/raw/stations
raw_regularite_path   = hdfs://namenode:9000/raw/regularite
silver_path           = hdfs://namenode:9000/silver

[hive]
database              = silver
table_validations     = validations_enrichies
table_stations        = stations_referentiel
table_regularite      = regularite_lignes

[local]
validations_csv_path  = ./data/validations-reseau-ferre-profils-horaires-par-jour-type-3eme-trimestre.csv
stations_csv_path     = ./data/arrets.csv
regularite_csv_path   = ./data/histo-validations-reseau-ferre.csv
ponctualite_csv_path  = ./data/ponctualite-mensuelle-transilien.csv
log_dir               = ./logs

[spark]
app_name_feeder       = feeder_idfm
app_name_processor    = processor_idfm
app_name_datamart     = datamart_idfm
master                = local[*]

[postgres]
host                  = postgres
port                  = 5432
database              = idfm_datamarts
user                  = idfm_user
password              = idfm_pass
jdbc_url              = jdbc:postgresql://postgres:5432/idfm_datamarts
jdbc_driver_path      = /postgresql-42.6.0.jar

[api]
host                  = 0.0.0.0
port                  = 8000
secret_key            = change_me_in_production
algorithm             = HS256
token_expire_minutes  = 60

db_host               = localhost
db_port               = 5433
db_name               = idfm_datamarts
db_user               = idfm_user
db_password           = idfm_pass

login_user            = admin
login_password        = admin

api_url               = http://localhost:8000

[thresholds]
saturation_threshold  = 5000
regularity_threshold  = 95
